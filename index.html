<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論語小測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-blue classroom stage. Four loud answer colours and the star jar carry the energy; everything else stays quiet. */
:root{
  --night:#1d1f52;--night-2:#2b2e6f;--paper:#fffaf0;--ink:#23244f;
  --red:#e5473f;--blue:#2f6fe0;--amber:#f2b227;--green:#22a566;--muted:#b9bbe6;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:#fff;font-family:var(--ui)}
body{background:radial-gradient(1200px 600px at 80% -10%,var(--night-2),transparent 60%),var(--night)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:3px}
#app{min-height:100dvh;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:18px 16px 40px}
.wide{max-width:1180px}
.muted{color:var(--muted)}
.sm{font-size:1.5rem;margin:0;font-family:var(--kai)}
.sync2{color:var(--muted);font-size:.85rem;margin-top:16px;text-align:center}
#sync{font-size:inherit}
ruby{ruby-position:over;font-family:var(--kai)}
rt{font-family:var(--ui);font-weight:500;font-size:.34em;letter-spacing:.02em;color:inherit;opacity:.85}
.nopy rt{display:none}
.hidepy rt{visibility:hidden}
.blank{display:inline-block;width:1em;height:1em;border-bottom:.09em solid currentColor;margin:0 .08em;vertical-align:-.1em}

/* registration and home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin:8px 0 24px}
.hero h1{font-family:var(--kai);font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:.04em}
.hero p{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.blocks{display:grid;grid-template-columns:repeat(2,52px);gap:8px}
.blocks i{display:block;width:52px;height:52px;border-radius:12px}
.blocks i:nth-child(1){background:var(--red)}.blocks i:nth-child(2){background:var(--blue)}
.blocks i:nth-child(3){background:var(--amber)}.blocks i:nth-child(4){background:var(--green)}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:1rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.field{width:100%;padding:14px 16px;border-radius:14px;border:3px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:1.3rem;font-family:var(--kai)}
.field:focus{border-color:var(--amber);outline:none}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.av{font-size:2.2rem;line-height:1;aspect-ratio:1;border-radius:18px;background:rgba(255,255,255,.08);border:3px solid transparent;display:grid;place-items:center}
.av.on{border-color:var(--amber);background:rgba(242,178,39,.18)}
.av:disabled{opacity:.35}
.band{flex:1 1 240px;text-align:left;background:rgba(255,255,255,.07);border:3px solid transparent;border-radius:16px;padding:16px 18px}
.band b{display:block;font-size:1.5rem;font-family:var(--kai)}
.band span{color:var(--muted);font-size:.95rem}
.band.on{border-color:var(--amber);background:rgba(242,178,39,.14)}
.band:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:14px 24px;border-radius:16px;font-weight:900;font-size:1.15rem;background:rgba(255,255,255,.12)}
.btn.primary{background:var(--amber);color:var(--ink);flex:1 1 220px;box-shadow:0 6px 0 #b8861a}
.btn.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #b8861a}
.btn.ghost{background:rgba(255,255,255,.1)}
.btn.good{background:var(--green);color:#fff;box-shadow:0 6px 0 #167a49}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #a8322c}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 #1d4fa8}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.note{color:var(--muted);font-size:.92rem;margin:14px 2px 0;line-height:1.6}
.linkbtn{color:var(--muted);text-decoration:underline;padding:8px 6px;font-size:.95rem}

/* learn */
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.chip{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;border:3px solid transparent}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.learn-line{display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.learn-line .txt{flex:1;font-size:clamp(1.7rem,5vw,2.4rem);line-height:2.1;font-family:var(--kai)}
.say{flex:none;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.5rem;display:grid;place-items:center}
.say:active{transform:scale(.94)}

/* quiz */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;width:100%;margin:0 auto;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:6em}
.who .av{width:44px;font-size:1.6rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto;height:44px}
.bar{flex:1;min-width:120px;height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.cnt{font-weight:700;color:var(--muted);min-width:4.5em;text-align:right}
.starbox{font-weight:900;font-size:1.25rem;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:99px}
.stage{flex:1;display:flex;flex-direction:column;gap:16px;max-width:1100px;width:100%;margin:0 auto;padding:0 16px 20px}
.ask{display:flex;align-items:center;gap:14px}
.mascot{font-size:3rem;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
.bubble{flex:1;background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 20px;font-size:clamp(1.15rem,3vw,1.6rem);font-weight:700;position:relative}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:0;border-right-color:var(--paper)}
.show{background:var(--paper);color:var(--ink);border-radius:24px;padding:18px 20px;text-align:center;font-family:var(--kai);font-size:clamp(2.6rem,9vw,5rem);line-height:1.9;min-height:130px;display:grid;place-items:center}
.show.line{font-size:clamp(2rem,6vw,3.4rem)}
.show.big{font-size:clamp(4rem,14vw,7rem)}
.show.q{font-size:clamp(3rem,10vw,5.6rem)}
.ans{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.ans.sent{grid-template-columns:1fr}
@media (max-width:700px){.ans{grid-template-columns:1fr}}
.a{position:relative;border-radius:20px;min-height:120px;padding:14px 12px;color:#fff;font-family:var(--kai);font-weight:700;display:grid;place-items:center;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .12s,opacity .25s,filter .25s}
.a:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.a .sh{position:absolute;left:12px;top:8px;font-size:1rem;opacity:.75;font-family:var(--ui)}
.a .t{font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.8}
.a .t.pinsty{font-family:var(--ui);font-weight:900;font-size:clamp(1.8rem,5.5vw,3rem);line-height:1.3}
.ans.sent .a{min-height:90px}
.ans.sent .a .t{font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:2}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--amber);color:var(--ink)}.c3{background:var(--green)}
.a.ok{animation:pop .5s}
.a.dim{opacity:.28;filter:grayscale(.6)}
.a.no{opacity:.35;filter:grayscale(1);animation:shake .4s}
.tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cwrap{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:0 auto;background:var(--paper);border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);overflow:hidden}
.cwrap .guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);font-size:min(60vw,230px);line-height:1;color:rgba(35,36,79,.13);pointer-events:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.reveal{background:#fff;color:var(--ink);border:4px solid var(--amber);border-radius:20px;padding:14px;text-align:center;font-family:var(--kai);font-size:clamp(2rem,6vw,3.2rem);line-height:2;margin-top:4px}
.foot{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:6px}
.msg{font-size:1.4rem;font-weight:900;flex:1;min-width:200px}
.msg.good{color:#8cf0b8}.msg.try{color:#ffd37a}
.next{background:#fff;color:var(--ink);padding:16px 34px;border-radius:16px;font-weight:900;font-size:1.3rem;box-shadow:0 6px 0 #b6b8d8}

/* scorecard and teacher */
.card-head{display:flex;align-items:center;gap:16px;margin:10px 0 18px}
.card-head .av.big{width:86px;height:86px;font-size:3rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto}
.score{text-align:center;margin:10px 0 18px}
.score .big{font-size:clamp(3.5rem,12vw,6rem);font-weight:900;line-height:1}
.score .big small{font-size:.4em;color:var(--muted)}
.stars-row{font-size:1.8rem;letter-spacing:.08em;margin:10px 0;word-break:break-all}
.tablewrap{overflow-x:auto;border-radius:16px;background:var(--paper);color:var(--ink)}
.sheet{width:100%;border-collapse:collapse;font-size:.98rem;min-width:520px}
.sheet th,.sheet td{padding:10px 12px;border-bottom:1px solid #e3e0cf;text-align:left;vertical-align:top}
.sheet th{background:#efeadb;font-weight:700}
.sheet .okrow td:nth-child(3){color:var(--green);font-weight:900;font-size:1.2rem}
.sheet .nrow td:nth-child(3){color:var(--red);font-weight:900;font-size:1.2rem}
.thead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 16px}
.jarpanel{display:flex;gap:20px;align-items:center;background:rgba(255,255,255,.06);border-radius:20px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.jar{position:relative;width:120px;height:150px;border:4px solid rgba(255,255,255,.7);border-radius:14px 14px 40px 40px;overflow:hidden;background:rgba(255,255,255,.05);flex:none}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--amber),#e89b10);transition:height .6s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{display:block;text-align:left;background:rgba(255,255,255,.07);border-radius:20px;padding:16px;border:3px solid transparent}
.pcard:focus-visible{border-color:#fff}
.pcard .av.big{width:64px;height:64px;font-size:2.4rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto;margin-bottom:8px}
.pname{font-size:1.25rem;font-weight:900;font-family:var(--kai)}
.tag{display:inline-block;margin:4px 0 10px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:.85rem;color:var(--muted)}
.pcard .bar{margin:6px 0}
.pstat{font-size:.95rem;color:var(--muted);margin:6px 0 10px}
.chip2{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700;font-size:.9rem}
.chip2.ok{background:var(--green)}
.detail{background:rgba(255,255,255,.07);border-radius:20px;padding:18px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.7);display:grid;place-items:center;padding:16px;z-index:60}
.modal .box{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;width:min(640px,100%)}
.modal textarea{width:100%;height:260px;font-size:.95rem}

@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){.hero{grid-template-columns:1fr}.blocks{display:none}.avatars{grid-template-columns:repeat(4,1fr)}.jarpanel{justify-content:center}}
.joinbox{display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.06);border-radius:20px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.qr{width:180px;height:180px;background:#fff;border-radius:14px;padding:8px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.roomnum{font-size:1.2rem;margin:6px 0}
.roomnum b{font-size:1.8rem;letter-spacing:.12em;color:var(--amber)}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===== 1. 經文與拼音（顏淵篇第十二 第四至第六章，依讀本校對） ===== */
const CHAPTERS = {
  4: [['司馬牛問君子','sī mǎ niú wèn jūn zǐ'],['子曰','zǐ yuē'],['君子不憂不懼','jūn zǐ bù yōu bú jù'],['曰','yuē'],['不憂不懼斯謂之君子矣乎','bù yōu bú jù sī wèi zhī jūn zǐ yǐ hū'],['子曰','zǐ yuē'],['內省不疚夫何憂何懼','nèi xǐng bú jiù fú hé yōu hé jù']],
  5: [['司馬牛憂曰人皆有兄弟我獨亡','sī mǎ niú yōu yuē rén jiē yǒu xiōng dì wǒ dú wú'],['子夏曰商聞之矣','zǐ xià yuē shāng wén zhī yǐ'],['死生有命富貴在天','sǐ shēng yǒu mìng fù guì zài tiān'],['君子敬而無失與人恭而有禮','jūn zǐ jìng ér wú shī yǔ rén gōng ér yǒu lǐ'],['四海之內皆兄弟也','sì hǎi zhī nèi jiē xiōng dì yě'],['君子何患乎無兄弟也','jūn zǐ hé huàn hū wú xiōng dì yě']],
  6: [['子張問明','zǐ zhāng wèn míng'],['子曰','zǐ yuē'],['浸潤之譖膚受之愬不行焉可謂明也已矣','jìn rùn zhī zèn fū shòu zhī sù bù xíng yān kě wèi míng yě yǐ yǐ'],['浸潤之譖膚受之愬不行焉可謂遠也已矣','jìn rùn zhī zèn fū shòu zhī sù bù xíng yān kě wèi yuǎn yě yǐ yǐ']]
};
const CH_TEXT={}, CH_PY={};
for(const k in CHAPTERS){CH_TEXT[k]=CHAPTERS[k].map(l=>l[0]).join('');CH_PY[k]=CHAPTERS[k].flatMap(l=>l[1].split(' '));}
function pyOf(frag,ch){
  for(const k of [ch,4,5,6]){const i=CH_TEXT[k]?CH_TEXT[k].indexOf(frag):-1;if(i>=0)return CH_PY[k].slice(i,i+frag.length);}
  return [...frag].map(()=>'');
}
function ruby(frag,ch,hide,src){
  const py=pyOf(src||frag,ch);
  return [...frag].map((c,i)=>c==='＿'?'<span class="blank"></span>':`<ruby>${c}<rt>${hide?'':(py[i]||'')}</rt></ruby>`).join('');
}
const LEARN={
  4:[['司馬牛問君子。','sī mǎ niú wèn jūn zǐ'],['子曰：「君子不憂不懼。」','zǐ yuē jūn zǐ bù yōu bú jù'],['曰：「不憂不懼，斯謂之君子矣乎？」','yuē bù yōu bú jù sī wèi zhī jūn zǐ yǐ hū'],['子曰：「內省不疚，夫何憂何懼？」','zǐ yuē nèi xǐng bú jiù fú hé yōu hé jù']],
  5:[['司馬牛憂曰：「人皆有兄弟，我獨亡！」','sī mǎ niú yōu yuē rén jiē yǒu xiōng dì wǒ dú wú'],['子夏曰：「商聞之矣：','zǐ xià yuē shāng wén zhī yǐ'],['死生有命，富貴在天。','sǐ shēng yǒu mìng fù guì zài tiān'],['君子敬而無失，與人恭而有禮，','jūn zǐ jìng ér wú shī yǔ rén gōng ér yǒu lǐ'],['四海之內，皆兄弟也。','sì hǎi zhī nèi jiē xiōng dì yě'],['君子何患乎無兄弟也？」','jūn zǐ hé huàn hū wú xiōng dì yě']],
  6:[['子張問明。','zǐ zhāng wèn míng'],['子曰：「浸潤之譖，膚受之愬，不行焉，可謂明也已矣！','zǐ yuē jìn rùn zhī zèn fū shòu zhī sù bù xíng yān kě wèi míng yě yǐ yǐ'],['浸潤之譖，膚受之愬，不行焉，可謂遠也已矣。」','jìn rùn zhī zèn fū shòu zhī sù bù xíng yān kě wèi yuǎn yě yǐ yǐ']]
};
const PUNCT=/[，。：？「」、！\s]/;
function learnRuby(han,py){const s=py.split(' ');let k=0;return [...han].map(c=>PUNCT.test(c)?`<span>${c}</span>`:`<ruby>${c}<rt>${s[k++]||''}</rt></ruby>`).join('');}
const CH_NAME={4:'第四章',5:'第五章',6:'第六章'};

/*BANK*/
/* ===== 2. 題庫（3–4歲：讀誦、寫字、選擇題；5–7歲：背誦、寫字、選擇題、前後句） ===== */
const F={
  find:(ch,t,o)=>({kind:'choice',mode:'char',label:'選擇題',ch,prompt:`找一找，哪一個是「${t}」？`,listen:`找一找，哪一個是${t}`,show:null,opts:o,ans:t}),
  same:(ch,t,o)=>({kind:'choice',mode:'char',label:'選擇題',ch,prompt:'哪一個和上面的字一樣？',listen:'哪一個和上面的字一樣',show:t,showSize:'big',opts:o,ans:t}),
  fill:(ch,full,hide,o)=>{const i=full.indexOf(hide);return{kind:'choice',mode:'char',label:'選擇題',ch,prompt:'缺了哪一個字？',listen:full.slice(0,i)+'什麼'+full.slice(i+hide.length),show:full.slice(0,i)+'＿'.repeat(hide.length)+full.slice(i+hide.length),src:full,showSize:'line',opts:o,ans:hide};},
  pin:(ch,w,a,o)=>({kind:'choice',mode:'pin',label:'選擇題',ch,prompt:`「${w}」怎麼讀？`,listen:w,show:w,showSize:'q',opts:o,ans:a}),
};
const YCHOICE=[
  F.find(4,'懼',['懼','憂','內']),F.find(4,'君',['君','憂','內']),F.find(4,'內',['內','不','子']),F.find(4,'疚',['疚','省','何']),F.find(4,'憂',['憂','懼','子']),F.same(4,'憂',['憂','懼','子']),
  F.find(5,'兄',['兄','弟','海']),F.find(5,'弟',['弟','兄','天']),F.find(5,'禮',['禮','恭','敬']),F.find(5,'敬',['敬','恭','禮']),F.find(5,'海',['海','天','命']),F.same(5,'恭',['恭','敬','失']),
  F.find(6,'明',['明','子','張']),F.find(6,'張',['張','問','子']),F.find(6,'行',['行','不','可']),F.same(6,'問',['問','明','子'])
];
const OCHOICE=[
  F.fill(4,'君子不憂不懼','懼',['懼','疚','禮']),F.fill(4,'內省不疚','疚',['疚','懼','憂']),

function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))||null;}

function speak(t){if(!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=.7;u.pitch=1.1;speechSynthesis.speak(u);}catch(e){}}
let AC;
function tone(freqs,dur=.12,type='sine',vol=.16){if(!SET.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.8);o.connect(g);g.connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*2);});}catch(e){}}

function confetti(){if(reduce)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#e5473f','#2f6fe0','#f2b227','#22a566','#ffffff'];const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6.28,va:(Math.random()-.5)*.4}));let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(++f<100)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();}

function setupCanvas(cv){
  const ctx=cv.getContext('2d');let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle='#23244f';ctx.lineWidth=20;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  const end=()=>{drawing=false;};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}

function record(part){
  const q=curQ();
  ME.results.push({n:q.n,label:q.label,prompt:q.prompt,ok:!!part.ok,given:part.given,correct:part.correct});

  persist();showNext();
}
/* 選擇題、前後句：選對即得星；選錯立刻公開正確答案，不用再選 */
function choose(k){
  if(S.locked)return;
  const q=curQ();const btns=[...document.querySelectorAll('[data-act="opt"]')];
  const ci=q.opts.indexOf(q.ans);const ok=k===ci;
  S.locked=true;
  btns.forEach((b,i)=>{b.disabled=true;if(i===ci)b.classList.add('ok');else if(i===k)b.classList.add('no');else b.classList.add('dim');});
  setMsg(ok,ok?praise():`正確答案是「${q.ans}」`);
  if(ok){yay();confetti();}else{oops();speak(`正確答案是 ${q.ans}`);}
  record({ok,given:q.opts[k],correct:q.ans});
}
/* 讀誦、背誦、寫字：老師判斷；答錯就顯示正確答案 */
function judge(ok){
  if(S.locked)return;
  const q=curQ();S.locked=true;
  const word=q.kind==='read'?'讀':q.kind==='recite'?'背':'寫';
  const correct=q.kind==='write'?q.char:q.text;
  if(ok){setMsg(true,praise());yay();confetti();}
  else{
    setMsg(false,'沒關係，看一看正確的');oops();
    const foot=document.querySelector('.foot');
    if(foot)foot.insertAdjacentHTML('beforebegin',`<div class="reveal">${ruby(correct,q.ch)}</div>`);
    speak(correct);
  }
  record({ok,given:(ok?'✔ ':'✘ ')+word+(ok?'對':'錯'),correct});
}
function peek(){
  const q=curQ();const el=$('#rtext');if(!el||!q||q.kind!=='recite')return;

const csvEsc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csvText(list){
  const rows=[['姓名','年齡組','狀態','目前星星','題號','題型','作答','正確答案','對錯']];
  list.forEach(p=>{
    const base=[p.name,BANDS[p.band]||'',p.status==='done'?'已完成':'進行中',p.stars||0];
    if(!(p.results||[]).length)rows.push([...base,'','','','','尚未作答']);
    (p.results||[]).forEach(r=>rows.push([...base,r.n,r.label,r.given,r.correct,r.ok?'對':'錯']));
  });
  return '﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n');
}
async function saveFile(name,text){
  try{
    const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);setSync('已下載成績');return;
  }catch(e){}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2 class="sm" style="color:var(--ink)">此裝置無法直接下載</h2><p>請全選下面文字，複製後貼到 Excel 或記事本，另存為 .csv。</p><textarea readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" style="flex:none" data-act="closemodal">關閉</button></div></div>`;
  document.body.appendChild(m);
}

/* 老師一次性設定：把 Firebase 專案的設定貼到下面（見設定說明） */
const FIREBASE_CONFIG={apiKey:'AIzaSyBJ89GeTX7OYfnGnOG55O4qirGayuumn78',authDomain:'lunyu-quiz.firebaseapp.com',projectId:'lunyu-quiz',storageBucket:'lunyu-quiz.firebasestorage.app',messagingSenderId:'132061025853',appId:'1:132061025853:web:f3e96d837e79b189fb3c54'};
const CONFIGURED=!String(FIREBASE_CONFIG.projectId).startsWith('PASTE_HERE');

let ME=null;
try{ME=JSON.parse(localStorage.getItem('lunyu-cls-me')||'null');}catch(e){ME=null;}
const saveMe=()=>{try{if(ME)localStorage.setItem('lunyu-cls-me',JSON.stringify(ME));else localStorage.removeItem('lunyu-cls-me');}catch(e){}};
let TEACHER=location.hash==='#teacher';
let VIEW='';
let FS=null,AUTH=null,CONNECTED=false;
let ROOM={ended:false},PLAYERS=[],SYNC='';
let unsubs=[];
let TROOM=(()=>{try{return localStorage.getItem('lunyu-cls-troom')||'';}catch(e){return '';}})();
const URLROOM=(new URLSearchParams(location.search).get('r')||'').replace(/\D/g,'').slice(0,6);
let CH={code:URLROOM,name:'',avatar:'',band:''};
let S={locked:false,peek:false,learnCh:4};
let T={sel:null,arm:null};
const SYNCTXT=()=>`<span id="sync">${esc(SYNC)}</span>`;
function setSync(t){SYNC=t;const el=document.getElementById('sync');if(el)el.textContent=t;}
const newCode=()=>String(Math.floor(100000+Math.random()*900000));
const roomRef=c=>FS.collection('rooms').doc(c);
const playersCol=c=>roomRef(c).collection('players');

async function connect(){
  if(CONNECTED)return true;
  if(!CONFIGURED){setSync('尚未設定資料庫，請老師先完成設定');return false;}
  if(typeof firebase==='undefined'){setSync('無法載入連線程式，請檢查網絡後重新整理');return false;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    AUTH=firebase.auth();FS=firebase.firestore();
    await AUTH.signInAnonymously();
    CONNECTED=true;setSync('已連線');return true;
  }catch(e){setSync('連線失敗：'+(e.code||e.message||'未知'));return false;}
}
function watch(code){
  unsubs.forEach(f=>{try{f();}catch(e){}});unsubs=[];
  PLAYERS=[];ROOM={ended:false};
  if(!FS||!code)return;
  unsubs.push(roomRef(code).onSnapshot(s=>{
    ROOM=(s.exists&&s.data())||{ended:false};
    if(TEACHER)renderTeacher();
    else if(VIEW==='reg')reg();
  },err=>setSync('同步出錯：'+(err.code||'未知'))));
  unsubs.push(playersCol(code).onSnapshot(snap=>{
    PLAYERS=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(TEACHER)renderTeacher();
  },err=>setSync('同步出錯：'+(err.code||'未知'))));
}

const playerBody=()=>({name:ME.name,avatar:ME.avatar,band:ME.band,status:ME.done?'done':'playing',stars:ME.stars,n:ME.results.length,results:ME.results,updated:Date.now()});
let saving=false,dirty=false;
function persist(){
  saveMe();
  if(!FS||!ME)return;
  dirty=true;
  if(!saving)flush();
}
async function flush(){
  saving=true;
  while(dirty&&FS&&ME){
    dirty=false;
    const room=ME.room,pid=ME.pid,body=playerBody();
    try{await playersCol(room).doc(pid).set(body);setSync('已同步');}
    catch(e){setSync('未能同步，稍後自動重試');dirty=true;await sleep(3000);}
  }
  saving=false;
}

/* ===== 5a. 小朋友：房間號碼、註冊、開始 ===== */
function reg(){
  VIEW='reg';
  const nm=CH.name.trim();
  const codeOk=/^\d{6}$/.test(CH.code);
  const ready=!!(codeOk&&nm&&CH.avatar&&CH.band);
  app.innerHTML=`<div class="wrap">
    <div class="hero"><div><h1>論語小測驗</h1><p>顏淵篇 第四至第六章　・　掃 QR 碼或輸入房間號碼即可開始</p></div>
      <div class="blocks" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
    <div class="panel"><h2>① 房間號碼（6 位數字，掃 QR 碼會自動填入）</h2>
      <input id="cd" class="field" inputmode="numeric" maxlength="6" value="${esc(CH.code)}" placeholder="例如：123456" autocomplete="off"></div>
    <div class="panel"><h2>② 你叫什麼名字？（最多 6 字）</h2>
      <input id="nm" class="field" maxlength="6" value="${esc(CH.name)}" placeholder="例如：小明" autocomplete="off"></div>
    <div class="panel"><h2>③ 選一個頭像</h2><div class="avatars">${AV.map(a=>`<button class="av ${CH.avatar===a?'on':''}" data-act="av" data-v="${a}" ${nm?'':'disabled'} aria-pressed="${CH.avatar===a}">${a}</button>`).join('')}</div></div>
    <div class="panel"><h2>④ 你幾歲？</h2><div class="row">
      <button class="band ${CH.band==='young'?'on':''}" data-act="band" data-v="young" ${CH.avatar?'':'disabled'} aria-pressed="${CH.band==='young'}"><b>3–4 歲</b><span>讀一讀、找一找、描一描</span></button>
      <button class="band ${CH.band==='older'?'on':''}" data-act="band" data-v="older" ${CH.avatar?'':'disabled'} aria-pressed="${CH.band==='older'}"><b>5–7 歲</b><span>背一背、寫一寫、接句子</span></button></div></div>
    <div class="cta"><button class="btn primary" data-act="go" id="go" ${ready?'':'disabled'}>開始測驗</button></div>
    <p class="note">測驗共 15 題。答錯會直接看到正確答案，不扣分，可以隨時開始。</p>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="linkbtn" data-act="learn">先學一學</button>
      <button class="linkbtn" data-act="setting" data-k="py">拼音：${SET.py?'開':'關'}</button>
      <button class="linkbtn" data-act="setting" data-k="auto">自動朗讀：${SET.auto?'開':'關'}</button>
      <button class="linkbtn" data-act="setting" data-k="snd">音效：${SET.snd?'開':'關'}</button></div>
    <p class="note" style="text-align:center"><button class="linkbtn" data-act="teacher">老師入口</button></p>
    <div class="sync2">${SYNCTXT()}</div></div>`;
}
function syncReg(){
  const nm=CH.name.trim();
  document.querySelectorAll('[data-act="av"]').forEach(b=>b.disabled=!nm);
  document.querySelectorAll('[data-act="band"]').forEach(b=>b.disabled=!CH.avatar);
  const go=document.getElementById('go');
  if(go)go.disabled=!(/^\d{6}$/.test(CH.code)&&nm&&CH.avatar&&CH.band);
}
async function startQuiz(){
  const code=CH.code;
  if(!(await connect()))return;
  const r=await roomRef(code).get();
  if(!r.exists){setSync('找不到房間號碼 '+code+'，請再確認');return;}
  if((r.data()||{}).ended){setSync('這個房間已經結束，請問老師');return;}
  ME={room:code,pid:rid(),name:CH.name.trim().slice(0,6),avatar:CH.avatar,band:CH.band,qs:makeQuiz(CH.band),results:[],stars:0,done:false,started:Date.now()};
  watch(code);saveMe();persist();question();
}
function renderChild(){
  if(ME&&!ME.done&&ME.results.length>=15){ME.done=true;ME.finished=Date.now();persist();}
  if(ME&&ME.done)return scorecard();
  if(ME)return question();
  return reg();
}

/* ===== 5b. 老師：房間、總界面 ===== */
async function newRoom(){
  if(!(await connect()))return;
  const code=newCode();
  await roomRef(code).set({ended:false,created:Date.now()});
  TROOM=code;try{localStorage.setItem('lunyu-cls-troom',code);}catch(e){}
  T.sel=null;T.arm=null;
  watch(code);renderTeacher();
}
async function initTeacher(){
  renderTeacher();
  if(!(await connect()))return;
  if(/^\d{6}$/.test(TROOM)){
    const r=await roomRef(TROOM).get();
    if(r.exists){watch(TROOM);renderTeacher();return;}
  }
  await newRoom();
}
function joinURL(){return location.href.split('#')[0].split('?')[0]+'?r='+TROOM;}
function renderTeacher(){
  VIEW='teacher';
  const list=PLAYERS.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh-Hant'));
  const total=list.reduce((s,p)=>s+(p.stars||0),0);
  const cap=Math.max(15,list.length*15);
  const pct=Math.min(100,total/cap*100);
  const sel=list.find(p=>p.id===T.sel);
  const ready=CONFIGURED&&/^\d{6}$/.test(TROOM);
  app.innerHTML=`<div class="wrap wide">
    <div class="thead"><div><h1 class="sm">論語小測驗・班級總界面</h1>
      <p class="muted">測驗狀態：<b>${ROOM.ended?'已結束':'進行中'}</b>　・　${SYNCTXT()}</p></div>
      <div class="row">
        <button class="btn ${ROOM.ended?'good':'red'}" data-act="endroom" ${ready?'':'disabled'}>${ROOM.ended?'重新開放':'結束測驗'}</button>
        <button class="btn ghost" data-act="csvall" ${ready?'':'disabled'}>下載全班成績</button>
        <button class="btn ghost" data-act="newroom" ${ready?'':'disabled'}>${T.arm==='newroom'?'再按一次，確定開新房間':'開新房間'}</button>
        <button class="btn ghost" data-act="child">小朋友頁面</button></div></div>
    <div class="joinbox">
      <div id="qr" class="qr" aria-label="掃碼加入的 QR 碼"></div>
      <div><h2 class="sm">掃碼或輸入房間號碼加入</h2>
        <p class="roomnum">房間號碼　<b>${ready?esc(TROOM):'—'}</b></p>
        <p class="muted" style="word-break:break-all">${ready?esc(joinURL()):'尚未設定資料庫，請見設定說明'}</p></div></div>
    <div class="jarpanel"><div class="jar" aria-hidden="true"><div class="water" style="height:${pct}%"></div></div>
      <div><h2 class="sm">班級星星罐</h2><p class="muted">已集 <b>${total}</b> ⭐　／　目標 ${cap} ⭐　（全班 ${list.length} 位，每人 15 題）</p></div></div>
    <div class="cards">${list.map(cardHTML).join('')||'<p class="muted">還沒有小朋友加入。請小朋友掃 QR 碼，或輸入上面的房間號碼。</p>'}</div>
    ${sel?detailHTML(sel):''}
    </div>`;
  if(ready&&window.qrcode){
    try{const qr=qrcode(0,'M');qr.addData(joinURL());qr.make();document.getElementById('qr').innerHTML=qr.createSvgTag({cellSize:5,margin:2});}catch(e){}
  }
}

/* ===== 7. 事件 ===== */
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==='av'){CH.avatar=d.v;reg();}
  else if(a==='band'){CH.band=d.v;reg();}
  else if(a==='go'){startQuiz();}
  else if(a==='opt'){choose(+d.k);}
  else if(a==='judge'){judge(d.ok==='1');}
  else if(a==='listen'){speak(curQ()&&curQ().listen);}
  else if(a==='peek'){peek();}
  else if(a==='clear'){const cv=$('#cv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
  else if(a==='next'){nextQ();}
  else if(a==='setting'){SET[d.k]=!SET[d.k];saveSet();VIEW==='learn'?learnPage():(VIEW==='reg'?reg():null);}
  else if(a==='learn'){learnPage();}
  else if(a==='back'){renderChild();}
  else if(a==='lc'){S.learnCh=+d.v;learnPage();}
  else if(a==='sayline'){speak(LEARN[S.learnCh][+d.i][0]);}
  else if(a==='sayall'){speak(LEARN[S.learnCh].map(l=>l[0]).join(''));}
  else if(a==='teacher'){location.hash='#teacher';}
  else if(a==='child'){location.hash='';}
  else if(a==='reset'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='再按一次，確定換人';return;}
    ME=null;saveMe();CH={code:CH.code,name:'',avatar:'',band:''};reg();
  }
  else if(a==='sel'){T.sel=d.id;T.arm=null;renderTeacher();}
  else if(a==='close'){T.sel=null;T.arm=null;renderTeacher();}
  else if(a==='endroom'){
    try{await roomRef(TROOM).set({ended:!ROOM.ended},{merge:true});}
    catch(err){setSync('未能更新，請再試');}
  }
  else if(a==='newroom'){
    if(T.arm!=='newroom'){T.arm='newroom';renderTeacher();return;}
    T.arm=null;await newRoom();
  }
  else if(a==='csvall'){saveFile('論語小測驗-全班成績.csv',csvText(PLAYERS));}
  else if(a==='csvone'){const p=PLAYERS.find(x=>x.id===d.id);if(p)saveFile(`論語小測驗-${p.name}-成績單.csv`,csvText([p]));}
  else if(a==='delp'){
    if(T.arm!==d.id){T.arm=d.id;renderTeacher();return;}
    try{await playersCol(TROOM).doc(d.id).delete();}catch(err){setSync('未能移除，請再試');}
    T.sel=null;T.arm=null;renderTeacher();
  }
  else if(a==='closemodal'){const m=el.closest('.modal');if(m)m.remove();}
});
app.addEventListener('input',e=>{
  if(e.target.id==='nm'){CH.name=e.target.value;syncReg();}
  if(e.target.id==='cd'){CH.code=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=CH.code;syncReg();}
});
document.addEventListener('keydown',e=>{
  if(VIEW==='quiz'&&S.locked&&(e.key==='ArrowRight'||e.key===' '||e.key==='Enter')){
    const b=document.querySelector('[data-act="next"]');if(b){e.preventDefault();b.click();}
  }
});
window.addEventListener('hashchange',()=>{
  TEACHER=location.hash==='#teacher';
  if(TEACHER)initTeacher();else renderChild();
});

/* ===== 8. 啟動 ===== */
async function init(){
  if(TEACHER){initTeacher();return;}
  renderChild();
  if(ME&&ME.room&&!ME.done){
    if(await connect()){watch(ME.room);persist();}
  }
}
init();
</script>
