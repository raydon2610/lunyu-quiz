<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論語小測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-blue classroom stage. Four loud answer colours and the star jar carry the energy; everything else stays quiet. */
:root{
  --night:#1d1f52;--night-2:#2b2e6f;--paper:#fffaf0;--ink:#23244f;
  --red:#e5473f;--blue:#2f6fe0;--amber:#f2b227;--green:#22a566;--muted:#b9bbe6;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:#fff;font-family:var(--ui)}
body{background:radial-gradient(1200px 600px at 80% -10%,var(--night-2),transparent 60%),var(--night)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default;opacity:.4}
button:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:3px}
#app{min-height:100dvh;display:flex;flex-direction:column}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:18px 16px 40px}
.wide{max-width:1180px}
.muted{color:var(--muted)}
.sm{font-size:1.5rem;margin:0;font-family:var(--kai)}
.sync2{color:var(--muted);font-size:.85rem;margin-top:16px;text-align:center}
#sync{font-size:inherit}
ruby{ruby-position:over;font-family:var(--kai)}
rt{font-family:var(--ui);font-weight:500;font-size:.34em;letter-spacing:.02em;color:inherit;opacity:.85}
.nopy rt{display:none}
.hidepy rt{visibility:hidden}
.blank{display:inline-block;width:1em;height:1em;border-bottom:.09em solid currentColor;margin:0 .08em;vertical-align:-.1em}

/* registration and home */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin:8px 0 24px}
.hero h1{font-family:var(--kai);font-size:clamp(2.6rem,9vw,4.4rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:.04em}
.hero p{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.blocks{display:grid;grid-template-columns:repeat(2,52px);gap:8px}
.blocks i{display:block;width:52px;height:52px;border-radius:12px}
.blocks i:nth-child(1){background:var(--red)}.blocks i:nth-child(2){background:var(--blue)}
.blocks i:nth-child(3){background:var(--amber)}.blocks i:nth-child(4){background:var(--green)}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:1rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.field{width:100%;padding:14px 16px;border-radius:14px;border:3px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);font-size:1.3rem;font-family:var(--kai)}
.field:focus{border-color:var(--amber);outline:none}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.av{font-size:2.2rem;line-height:1;aspect-ratio:1;border-radius:18px;background:rgba(255,255,255,.08);border:3px solid transparent;display:grid;place-items:center}
.av.on{border-color:var(--amber);background:rgba(242,178,39,.18)}
.av:disabled{opacity:.35}
.band{flex:1 1 240px;text-align:left;background:rgba(255,255,255,.07);border:3px solid transparent;border-radius:16px;padding:16px 18px}
.band b{display:block;font-size:1.5rem;font-family:var(--kai)}
.band span{color:var(--muted);font-size:.95rem}
.band.on{border-color:var(--amber);background:rgba(242,178,39,.14)}
.band:disabled{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:14px 24px;border-radius:16px;font-weight:900;font-size:1.15rem;background:rgba(255,255,255,.12)}
.btn.primary{background:var(--amber);color:var(--ink);flex:1 1 220px;box-shadow:0 6px 0 #b8861a}
.btn.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #b8861a}
.btn.ghost{background:rgba(255,255,255,.1)}
.btn.good{background:var(--green);color:#fff;box-shadow:0 6px 0 #167a49}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #a8322c}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 0 #1d4fa8}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.note{color:var(--muted);font-size:.92rem;margin:14px 2px 0;line-height:1.6}
.linkbtn{color:var(--muted);text-decoration:underline;padding:8px 6px;font-size:.95rem}

/* learn */
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.chip{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;border:3px solid transparent}
.chip[aria-pressed="true"]{background:var(--amber);color:var(--ink)}
.learn-line{display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.learn-line .txt{flex:1;font-size:clamp(1.7rem,5vw,2.4rem);line-height:2.1;font-family:var(--kai)}
.say{flex:none;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.5rem;display:grid;place-items:center}
.say:active{transform:scale(.94)}

/* quiz */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;width:100%;margin:0 auto;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:6em}
.who .av{width:44px;font-size:1.6rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto;height:44px}
.bar{flex:1;min-width:120px;height:14px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.cnt{font-weight:700;color:var(--muted);min-width:4.5em;text-align:right}
.starbox{font-weight:900;font-size:1.25rem;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:99px}
.stage{flex:1;display:flex;flex-direction:column;gap:16px;max-width:1100px;width:100%;margin:0 auto;padding:0 16px 20px}
.ask{display:flex;align-items:center;gap:14px}
.mascot{font-size:3rem;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
.bubble{flex:1;background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 20px;font-size:clamp(1.15rem,3vw,1.6rem);font-weight:700;position:relative}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-left:0;border-right-color:var(--paper)}
.show{background:var(--paper);color:var(--ink);border-radius:24px;padding:18px 20px;text-align:center;font-family:var(--kai);font-size:clamp(2.6rem,9vw,5rem);line-height:1.9;min-height:130px;display:grid;place-items:center}
.show.line{font-size:clamp(2rem,6vw,3.4rem)}
.show.big{font-size:clamp(4rem,14vw,7rem)}
.show.q{font-size:clamp(3rem,10vw,5.6rem)}
.ans{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.ans.sent{grid-template-columns:1fr}
@media (max-width:700px){.ans{grid-template-columns:1fr}}
.a{position:relative;border-radius:20px;min-height:120px;padding:14px 12px;color:#fff;font-family:var(--kai);font-weight:700;display:grid;place-items:center;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .12s,opacity .25s,filter .25s}
.a:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.a .sh{position:absolute;left:12px;top:8px;font-size:1rem;opacity:.75;font-family:var(--ui)}
.a .t{font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.8}
.a .t.pinsty{font-family:var(--ui);font-weight:900;font-size:clamp(1.8rem,5.5vw,3rem);line-height:1.3}
.ans.sent .a{min-height:90px}
.ans.sent .a .t{font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:2}
.c0{background:var(--red)}.c1{background:var(--blue)}.c2{background:var(--amber);color:var(--ink)}.c3{background:var(--green)}
.a.ok{animation:pop .5s}
.a.dim{opacity:.28;filter:grayscale(.6)}
.a.no{opacity:.35;filter:grayscale(1);animation:shake .4s}
.tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cwrap{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:0 auto;background:var(--paper);border-radius:22px;box-shadow:0 7px 0 rgba(0,0,0,.25);overflow:hidden}
.cwrap .guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);font-size:min(60vw,230px);line-height:1;color:rgba(35,36,79,.13);pointer-events:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.reveal{background:#fff;color:var(--ink);border:4px solid var(--amber);border-radius:20px;padding:14px;text-align:center;font-family:var(--kai);font-size:clamp(2rem,6vw,3.2rem);line-height:2;margin-top:4px}
.foot{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:6px}
.msg{font-size:1.4rem;font-weight:900;flex:1;min-width:200px}
.msg.good{color:#8cf0b8}.msg.try{color:#ffd37a}
.next{background:#fff;color:var(--ink);padding:16px 34px;border-radius:16px;font-weight:900;font-size:1.3rem;box-shadow:0 6px 0 #b6b8d8}

/* scorecard and teacher */
.card-head{display:flex;align-items:center;gap:16px;margin:10px 0 18px}
.card-head .av.big{width:86px;height:86px;font-size:3rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto}
.score{text-align:center;margin:10px 0 18px}
.score .big{font-size:clamp(3.5rem,12vw,6rem);font-weight:900;line-height:1}
.score .big small{font-size:.4em;color:var(--muted)}
.stars-row{font-size:1.8rem;letter-spacing:.08em;margin:10px 0;word-break:break-all}
.tablewrap{overflow-x:auto;border-radius:16px;background:var(--paper);color:var(--ink)}
.sheet{width:100%;border-collapse:collapse;font-size:.98rem;min-width:520px}
.sheet th,.sheet td{padding:10px 12px;border-bottom:1px solid #e3e0cf;text-align:left;vertical-align:top}
.sheet th{background:#efeadb;font-weight:700}
.sheet .okrow td:nth-child(3){color:var(--green);font-weight:900;font-size:1.2rem}
.sheet .nrow td:nth-child(3){color:var(--red);font-weight:900;font-size:1.2rem}
.thead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 16px}
.jarpanel{display:flex;gap:20px;align-items:center;background:rgba(255,255,255,.06);border-radius:20px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.jar{position:relative;width:120px;height:150px;border:4px solid rgba(255,255,255,.7);border-radius:14px 14px 40px 40px;overflow:hidden;background:rgba(255,255,255,.05);flex:none}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--amber),#e89b10);transition:height .6s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{display:block;text-align:left;background:rgba(255,255,255,.07);border-radius:20px;padding:16px;border:3px solid transparent}
.pcard:focus-visible{border-color:#fff}
.pcard .av.big{width:64px;height:64px;font-size:2.4rem;border:0;background:rgba(255,255,255,.12);aspect-ratio:auto;margin-bottom:8px}
.pname{font-size:1.25rem;font-weight:900;font-family:var(--kai)}
.tag{display:inline-block;margin:4px 0 10px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);font-size:.85rem;color:var(--muted)}
.pcard .bar{margin:6px 0}
.pstat{font-size:.95rem;color:var(--muted);margin:6px 0 10px}
.chip2{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:700;font-size:.9rem}
.chip2.ok{background:var(--green)}
.detail{background:rgba(255,255,255,.07);border-radius:20px;padding:18px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(10,10,30,.7);display:grid;place-items:center;padding:16px;z-index:60}
.modal .box{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;width:min(640px,100%)}
.modal textarea{width:100%;height:260px;font-size:.95rem}

@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){.hero{grid-template-columns:1fr}.blocks{display:none}.avatars{grid-template-columns:repeat(4,1fr)}.jarpanel{justify-content:center}}
.joinbox{display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.06);border-radius:20px;padding:18px;margin-bottom:16px;flex-wrap:wrap}
.qr{width:180px;height:180px;background:#fff;border-radius:14px;padding:8px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.roomnum{font-size:1.2rem;margin:6px 0}
.roomnum b{font-size:1.8rem;letter-spacing:.12em;color:var(--amber)}

/* ---- 設計版總界面 ---- */
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at top,#3b3f9e 0%,#1d1f5c 55%,#12133a 100%)}
.sky i{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.t-head{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:rgba(255,255,255,.08);border-radius:24px;padding:16px 22px;margin-bottom:16px}
.cloud{position:absolute;width:150px;opacity:.85;pointer-events:none}
.cloud.c1{right:260px;top:-10px;animation:drift 18s ease-in-out infinite alternate}
.cloud.c2{right:60px;bottom:-30px;width:110px;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(16px)}}
.t-brand{display:flex;align-items:center;gap:14px;position:relative}
.mascot-svg{width:72px;height:72px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.t-title{font-size:2rem;margin:0;color:#fff;letter-spacing:.04em}
.t-actions{position:relative}
.t-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.t-grid{grid-template-columns:1fr}}
.jar-panel{background:rgba(255,255,255,.08);border-radius:24px;padding:18px;text-align:center}
.jar-title{font-size:1.4rem;color:#fff;margin:0}
.jar-sub{color:#cfd3ff;margin:4px 0 10px;font-size:.95rem}
.jar2{position:relative;width:200px;height:250px;margin:0 auto}
.jar-lid{position:absolute;left:30px;right:30px;top:0;height:22px;border-radius:10px;background:linear-gradient(#e9f4ff,#9fc3ea);border:3px solid #6f8fb8;z-index:2}
.jar-body{position:absolute;left:0;right:0;top:18px;bottom:0;border-radius:22px 22px 60px 60px;border:5px solid rgba(255,255,255,.75);background:rgba(255,255,255,.1);overflow:hidden}
.jar-water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fd3ff,#2b8fe0);transition:height 1.2s cubic-bezier(.3,.7,.3,1);opacity:.85}
.jar-water::before{content:"";position:absolute;left:-10%;right:-10%;top:-10px;height:22px;background:radial-gradient(ellipse at 50% 100%,#bfeaff 40%,transparent 42%) 0 0/28px 22px repeat-x;animation:wave 2.2s linear infinite}
@keyframes wave{to{background-position:28px 0}}
.jar-shine{position:absolute;left:14px;top:30px;bottom:30px;width:10px;border-radius:8px;background:rgba(255,255,255,.45)}
.jar-star{position:absolute;width:26px;height:26px;animation:float 3s ease-in-out infinite}
.jar-star svg{width:100%;height:100%;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.jar-count{margin-top:10px;font-size:1.35rem;font-weight:800;color:#ffd23f}
.joinbox2{display:flex;gap:12px;align-items:center;margin-top:14px;text-align:left;flex-wrap:wrap;justify-content:center}
.joinbox2 .qr{width:150px;height:150px}
.small-url{word-break:break-all;font-size:.75rem}
.empty-state{grid-column:1/-1;text-align:center;color:#fff;background:rgba(255,255,255,.07);border-radius:24px;padding:28px}
.empty-state .mascot-svg{margin:0 auto 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pcard{display:block;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border-radius:24px;padding:16px 14px;border:3px solid rgba(255,255,255,.12);box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.pcard:hover{transform:translateY(-3px) rotate(-.5deg)}
.pbadge{width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 4px 0 #d9d2ff}
.pname{font-size:1.2rem;font-weight:800;color:#fff}
.ptag{display:inline-block;margin:4px 0 8px;padding:2px 10px;border-radius:99px;background:#ff8fb1;color:#fff;font-size:.8rem;font-weight:700}
.pslots{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin:8px 0}
.slot{display:grid;place-items:center;height:18px;border-radius:5px;background:rgba(255,255,255,.14);font-size:.7rem;color:#fff;font-weight:800}
.slot.ok{background:#ffd23f;color:#5a3d00}
.slot.no{background:#ff7a7a;color:#fff}
.slot.cur{outline:2px dashed #ffd23f}
.pfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:.8rem;color:#e6e8ff;font-weight:700}
.pstatus{padding:0 6px;border-radius:99px;background:rgba(255,255,255,.18)}
.pstatus.done{background:#3ddc97;color:#06331f}
.flyer{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;z-index:50}
.flyer svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #ffd23f)}
.detail{background:#fff;color:#23244f;border-radius:24px;padding:18px;margin-top:18px}
.detail .muted{color:#5a5e8a}
.detail .btn.ghost{color:#23244f;border-color:#23244f}
.sm-url{word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===== 1. 經文與拼音（顏淵篇第十二 第四至第六章，依讀本校對） ===== */
const CHAPTERS = {

  cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle='#23244f';ctx.lineWidth=20;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});

}
function peek(){
  const q=curQ();const el=$('#rtext');if(!el||!q||q.kind!=='recite')return;
  S.peek=!S.peek;
  el.innerHTML=S.peek?ruby(q.text,q.ch):'？'.repeat(Math.min(q.text.length,10));
}
function nextQ(){
  if(!S.locked)return;
  if(ME.results.length>=15)finish();else question();
}
function finish(){
  ME.done=true;ME.finished=Date.now();persist();
  scorecard();yay();setTimeout(confetti,200);
}
function scorecard(){
  VIEW='card';
  const ok=ME.results.filter(r=>r.ok).length;
  app.innerHTML=`<div class="wrap">
    <div class="card-head"><div class="av big">${esc(ME.avatar)}</div>
      <div><h1 class="sm">${esc(ME.name)} 的成績單</h1><p class="muted">${BANDS[ME.band]||''}　・　顏淵篇 第四至第六章</p></div></div>
    <div class="score"><div class="big">${ok}<small> / 15</small></div><div class="stars-row" aria-label="${ok} 顆星">${'⭐'.repeat(ok)}</div>
      <p class="muted">答題紀錄已交給老師存檔</p></div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>題</th><th>類型</th><th>對錯</th><th>作答</th><th>正確答案</th></tr></thead>
      <tbody>${ME.results.map(r=>`<tr class="${r.ok?'okrow':'nrow'}"><td>${r.n}</td><td>${esc(r.label)}</td><td>${r.ok?'✔':'✘'}</td><td>${esc(r.given)}</td><td>${esc(r.correct)}</td></tr>`).join('')}</tbody></table></div>
    <div class="cta" style="justify-content:center"><button class="btn ghost" data-act="reset">換一位小朋友</button></div>
    <div class="sync2">${SYNCTXT()}</div></div>`;
}
function learnPage(){
  VIEW='learn';const c=S.learnCh;
  app.innerHTML=`<div class="wrap">
    <div class="row" style="justify-content:space-between;align-items:center"><button class="btn ghost" data-act="back">← 返回</button><button class="btn blue" data-act="sayall">🔊 全章朗讀</button></div>
    <div class="tabs">${[4,5,6].map(k=>`<button class="chip" data-act="lc" data-v="${k}" aria-pressed="${k===c}">${CH_NAME[k]}</button>`).join('')}</div>
    <div class="${SET.py?'':'nopy'}">${LEARN[c].map((l,i)=>`<div class="learn-line"><div class="txt">${learnRuby(l[0],l[1])}</div><button class="say" data-act="sayline" data-i="${i}" aria-label="朗讀">🔊</button></div>`).join('')}</div>
    <p class="note">點 🔊 聽一聽，再跟著唸。</p></div>`;
}

/* ===== 6. 老師總界面（設計版：星空教室、星星罐、飛入動畫） ===== */
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const rad=i%2?r:R;const a=-Math.PI/2+i*Math.PI/5;p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(' ');}
const STAR_SVG=`<svg viewBox="0 0 120 120" aria-hidden="true"><polygon points="${starPts(60,62,56,24)}" fill="#ffd23f" stroke="#e8a300" stroke-width="6" stroke-linejoin="round"/><circle cx="60" cy="58" r="0" /></svg>`;
const MASCOT_SVG=`<svg class="mascot-svg" viewBox="0 0 140 140" aria-hidden="true">
  <polygon points="${starPts(70,74,62,28)}" fill="#ffd23f" stroke="#e8a300" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="50" cy="72" rx="5.5" ry="7" fill="#23244f"/><ellipse cx="90" cy="72" rx="5.5" ry="7" fill="#23244f"/>
  <circle cx="46" cy="86" r="6" fill="#ff8a80" opacity=".7"/><circle cx="94" cy="86" r="6" fill="#ff8a80" opacity=".7"/>
  <path d="M58 84 Q70 96 82 84" stroke="#23244f" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;
const CLOUD_SVG=`<svg class="cloud" viewBox="0 0 200 90" aria-hidden="true"><path d="M30 80 Q5 80 10 55 Q15 35 40 40 Q45 15 75 20 Q95 0 120 22 Q150 15 160 40 Q190 40 188 65 Q186 80 160 80Z" fill="#ffffff"/></svg>`;
const SLOT_ICON={ok:'★',no:'✕',cur:'',empty:''};

function cardHTML(p){
  const n=p.n||0,res=p.results||[],okN=res.filter(r=>r.ok).length;
  const done=p.status==='done';
  const slots=Array.from({length:15},(_,i)=>{
    const r=res[i];
    if(r)return `<span class="slot ${r.ok?'ok':'no'}">${r.ok?'★':'✕'}</span>`;
    return `<span class="slot ${i===n&&!done?'cur':''}"></span>`;
  }).join('');
  return `<button class="pcard" data-act="sel" data-id="${esc(p.id)}">
    <div class="pbadge">${esc(p.avatar||'🙂')}</div>
    <div class="pname">${esc(p.name)}</div>
    <span class="ptag">${esc(BANDS[p.band]||'')}</span>
    <div class="pslots">${slots}</div>
    <div class="pfoot"><span>⭐ ${p.stars||0}</span><span>答對 ${okN}/15</span><span class="pstatus ${done?'done':''}">${done?'已完成':n?'進行中':'剛開始'}</span></div>
  </button>`;
}
function detailHTML(p){
  const res=(p.results||[]);
  const rows=res.map(r=>`<tr class="${r.ok?'okrow':'nrow'}"><td>${r.n}</td><td>${esc(r.label)}</td><td>${r.ok?'✔':'✘'}</td><td>${esc(r.given)}</td><td>${esc(r.correct)}</td></tr>`).join('');
  return `<div class="detail">
    <div class="row" style="justify-content:space-between;align-items:center"><h2 class="sm">${esc(p.avatar)} ${esc(p.name)} 的答題紀錄</h2><button class="btn ghost" data-act="close">關閉</button></div>
    <p class="muted">${esc(BANDS[p.band]||'')}　・　已答 ${res.length} 題　・　答對 ${res.filter(r=>r.ok).length} / 15　・　⭐ ${p.stars||0}</p>
    <div class="tablewrap"><table class="sheet"><thead><tr><th>題</th><th>類型</th><th>對錯</th><th>作答</th><th>正確答案</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5">尚未作答</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:14px"><button class="btn blue" data-act="csvone" data-id="${esc(p.id)}">下載此人成績單</button>
      <button class="btn red" data-act="delp" data-id="${esc(p.id)}">${T.arm===p.id?'再按一次，確定移除':'移除此人'}</button></div></div>`;
}

/* ===== 6b. 成績單（含分數） ===== */
const csvEsc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const csvLine=r=>r.map(csvEsc).join(',');
function scoreOf(p){const res=p.results||[];const ok=res.filter(r=>r.ok).length;return {ok,answered:res.length,pct:Math.round(ok/15*100)};}
function csvAll(list){
  const head=['姓名','年齡組','狀態','答對題數','已答題數','分數（/15）','正確率','星星'];
  for(let i=1;i<=15;i++)head.push('第'+i+'題');
  const rows=[head];
  list.forEach(p=>{
    const s=scoreOf(p);
    const row=[p.name,BANDS[p.band]||'',p.status==='done'?'已完成':'進行中',s.ok,s.answered,`${s.ok} / 15`,s.pct+'%',p.stars||0];
    for(let i=0;i<15;i++){const r=(p.results||[])[i];row.push(r?`${r.ok?'✔':'✘'} ${r.label}`:'');}
    rows.push(row);
  });
  return '﻿'+rows.map(csvLine).join('\r\n');
}
function csvOne(p){
  const s=scoreOf(p);
  const lines=[
    csvLine(['姓名','年齡組','狀態','分數（/15）','正確率','星星']),
    csvLine([p.name,BANDS[p.band]||'',p.status==='done'?'已完成':'進行中',`${s.ok} / 15`,s.pct+'%',p.stars||0]),
    '',
    csvLine(['題號','類型','對錯','作答','正確答案'])
  ];
  (p.results||[]).forEach(r=>lines.push(csvLine([r.n,r.label,r.ok?'對':'錯',r.given,r.correct])));
  return '﻿'+lines.join('\r\n');
}
async function saveFile(name,text){
  try{
    const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);setSync('已下載成績');return;
  }catch(e){}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2 class="sm" style="color:var(--ink)">此裝置無法直接下載</h2><p>請全選下面文字，複製後貼到 Excel 或記事本，另存為 .csv。</p><textarea readonly>${esc(text)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" style="flex:none" data-act="closemodal">關閉</button></div></div>`;
  document.body.appendChild(m);
}

/* ===== 6c. 星空背景與星星罐 ===== */
function buildSky(){
  if(document.querySelector('.sky'))return;
  const sky=document.createElement('div');sky.className='sky';sky.setAttribute('aria-hidden','true');
  for(let i=0;i<70;i++){const d=document.createElement('i');d.style.left=((i*73)%100)+'%';d.style.top=((i*41)%100)+'%';d.style.animationDelay=((i*0.37)%3)+'s';d.style.width=d.style.height=(i%5===0?4:2)+'px';sky.appendChild(d);}
  document.body.prepend(sky);
}
function jarStarsHTML(total,pct){
  const n=Math.min(total,90);let h='';
  for(let i=0;i<n;i++){
    const x=6+((i*47)%84), y=2+((i*29)%96)/100*Math.max(pct,10)*0.92;
    h+=`<span class="jar-star" style="left:${x}%;bottom:${y}%;animation-delay:${(i%7)*0.4}s">${STAR_SVG}</span>`;
  }
  return h;
}
function jarHTML(total,cap){
  const pct=Math.min(100,total/cap*100);
  return `<div class="jar2" id="jar" aria-label="班級星星罐">
    <div class="jar-lid"></div>
    <div class="jar-body">
      <div class="jar-water" style="height:${pct}%"></div>
      <div class="jar-shine"></div>
      ${jarStarsHTML(total,pct)}
    </div>
    <div class="jar-count">${total} ⭐ / ${cap}</div>
  </div>`;
}
let PREV=null;
function flyStar(fromEl,toEl,delay){
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const sx=a.left+a.width/2,sy=a.top+a.height/2,tx=b.left+b.width/2,ty=b.top+b.height/2;
  const el=document.createElement('div');el.className='flyer';el.innerHTML=STAR_SVG;
  el.style.left=sx+'px';el.style.top=sy+'px';document.body.appendChild(el);
  if(reduce){setTimeout(()=>el.remove(),200);return;}
  const dx=tx-sx,dy=ty-sy;
  el.animate([
    {transform:'translate(-50%,-50%) scale(.5) rotate(0deg)',opacity:1},
    {transform:`translate(calc(-50% + ${dx*.35}px), calc(-50% + ${dy*.35-120}px)) scale(1.4) rotate(200deg)`,opacity:1,offset:.45},
    {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.45) rotate(420deg)`,opacity:.3}
  ],{duration:1100,delay,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).onfinish=()=>{
    el.remove();
    const jar=document.getElementById('jar');
    if(jar)jar.animate([{transform:'scale(1)'},{transform:'scale(1.05) rotate(-1deg)'},{transform:'scale(1)'}],{duration:350});
  };
}
function animateGains(list){
  if(PREV===null){PREV={};list.forEach(p=>PREV[p.id]=p.stars||0);return;}
  let k=0;
  list.forEach(p=>{
    const prev=PREV[p.id]??null,cur=p.stars||0;
    if(prev!==null&&cur>prev){
      const card=document.querySelector(`[data-act="sel"][data-id="${CSS.escape(p.id)}"]`);
      const jar=document.getElementById('jar');
      if(card&&jar){for(let i=0;i<Math.min(cur-prev,5);i++){flyStar(card,jar,k*120+i*140);}k++;}
    }
    PREV[p.id]=cur;
  });
}

/* ===== 6d. 老師總界面 ===== */
/* ===== 7. 事件 ===== */
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  if(a==='av'){CH.avatar=d.v;reg();}
  else if(a==='band'){CH.band=d.v;reg();}
  else if(a==='go'){startQuiz();}
  else if(a==='opt'){choose(+d.k);}
  else if(a==='judge'){judge(d.ok==='1');}
  else if(a==='listen'){speak(curQ()&&curQ().listen);}
  else if(a==='peek'){peek();}
  else if(a==='clear'){const cv=$('#cv');if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
  else if(a==='next'){nextQ();}
  else if(a==='setting'){SET[d.k]=!SET[d.k];saveSet();VIEW==='learn'?learnPage():(VIEW==='reg'?reg():null);}
  else if(a==='learn'){learnPage();}
  else if(a==='back'){renderChild();}
  else if(a==='lc'){S.learnCh=+d.v;learnPage();}
  else if(a==='sayline'){speak(LEARN[S.learnCh][+d.i][0]);}
  else if(a==='sayall'){speak(LEARN[S.learnCh].map(l=>l[0]).join(''));}
  else if(a==='teacher'){location.hash='#teacher';}
  else if(a==='child'){location.hash='';}
  else if(a==='reset'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='再按一次，確定換人';return;}
    ME=null;saveMe();CH={code:CH.code,name:'',avatar:'',band:''};reg();
  }
  else if(a==='sel'){T.sel=d.id;T.arm=null;renderTeacher();}
  else if(a==='close'){T.sel=null;T.arm=null;renderTeacher();}
  else if(a==='endroom'){
    try{await roomRef(TROOM).set({ended:!ROOM.ended},{merge:true});}
    catch(err){setSync('未能更新，請再試');}
  }
  else if(a==='newroom'){
    if(T.arm!=='newroom'){T.arm='newroom';renderTeacher();return;}
    T.arm=null;await newRoom();
  }
  else if(a==='csvall'){saveFile('論語小測驗-全班成績.csv',csvAll(PLAYERS));}
  else if(a==='csvone'){const p=PLAYERS.find(x=>x.id===d.id);if(p)saveFile(`論語小測驗-${p.name}-成績單.csv`,csvOne(p));}
  else if(a==='delp'){
    if(T.arm!==d.id){T.arm=d.id;renderTeacher();return;}
    try{await playersCol(TROOM).doc(d.id).delete();}catch(err){setSync('未能移除，請再試');}
    T.sel=null;T.arm=null;renderTeacher();
  }
  else if(a==='closemodal'){const m=el.closest('.modal');if(m)m.remove();}
});
app.addEventListener('input',e=>{
  if(e.target.id==='nm'){CH.name=e.target.value;syncReg();}
  if(e.target.id==='cd'){CH.code=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=CH.code;syncReg();}
});
document.addEventListener('keydown',e=>{
  if(VIEW==='quiz'&&S.locked&&(e.key==='ArrowRight'||e.key===' '||e.key==='Enter')){
    const b=document.querySelector('[data-act="next"]');if(b){e.preventDefault();b.click();}
  }
});
window.addEventListener('hashchange',()=>{
  TEACHER=location.hash==='#teacher';
  if(TEACHER)initTeacher();else renderChild();
});

/* ===== 8. 啟動 ===== */
async function init(){
  if(TEACHER){initTeacher();return;}
  renderChild();
  if(ME&&ME.room&&!ME.done){
    if(await connect()){watch(ME.room);persist();}
  }
}
init();
</script>
